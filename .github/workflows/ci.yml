# CI - epy_studio (public, MIT).
# One suite dependency, epy_export, which is published on no index: the
# step below installs it from its repository, and no token is needed now
# that repository is public. The four applications are NOT dependencies
# -- the launcher starts their executables and never imports them.
name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: ruff check
        run: ruff check .

  typecheck:
    name: Typecheck (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the shared engine (not on PyPI)
        run: >-
          pip install "epy_export[pdf,qt] @ git+https://github.com/estructuraPy/epy_export.git@v0.2.0"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Install pyright
        run: npm install -g pyright
      # pyrightconfig.json pins pythonPlatform to Windows. typeshed
      # guards winreg behind sys.platform == "win32", and this launcher
      # is mostly registry code, so on a Linux runner pyright would
      # resolve the module and none of its attributes -- errors that do
      # not exist on the platform this code runs on.
      - name: pyright
        run: pyright

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install the shared engine (not on PyPI)
        run: >-
          pip install "epy_export[pdf,qt] @ git+https://github.com/estructuraPy/epy_export.git@v0.2.0"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q

  # NO housekeeper job, and this is the reason rather than an oversight.
  # Its --strict audits load their canonical blocks from
  # _packaging/_tooling/, which is a SEPARATE and private repository. A
  # runner that checks out this one alone does not have them, and the
  # housekeeper fails loudly when a block is missing -- deliberately, on
  # the principle that a silently skipped rule is worse than none. The
  # audits therefore run from a full-suite checkout, not from here.

  build:
    name: Build distribution
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      # pyproject-build, NOT "python -m build": for -m, sys.path[0] is
      # the working directory, and this repository ships its own
      # build.py at the root -- the PyInstaller driver. "python -m build"
      # would run that instead of the PyPA builder.
      - name: Build sdist + wheel
        run: pyproject-build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
