[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epy_studio"
version = "0.8.4"
description = "Pick the right ePy editor for the document at hand."
authors = [{ name = "Ing. Angel Navarro-Mora M.Sc.", email = "ahnavarroitcr@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "epy_export>=0.3.0",
    "PySide6>=6.6",
]

# NOTE: the four applications are NOT dependencies. Studio launches
# their executables from the shared install directory; it never imports
# them. Nor is epy_docs: it is a commercial package reached out of
# process, and naming it in an extra would make a pip install resolve
# against whatever public index happens to answer.
#
# epy_export IS a dependency: a library, not an application, and the
# one place the organisation name of every settings scope lives.

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "pyinstaller>=6.0"]

[project.gui-scripts]
epy_studio = "epy_studio.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/epy_studio"]

[tool.ruff]
extend-exclude = ["src/*/epy_suite_connect/_packaging", ".claude"]
line-length = 79
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# housekeeper.py is the suite's shared gate, carried as one file per repo and
# kept byte-identical to its siblings except for the package name inside its
# own paths. Reformatting this copy forks it from the others, and the next
# time one is synced the change is reverted or conflicts with it, so its
# formatting is not this repository's to set. (This comment used to credit a
# template at _packaging/_tooling/templates/housekeeper_minimal.py. No such
# file or directory exists in any of the thirty-four repos: there is no
# generator, each repo carries its own copy.)
"housekeeper.py" = ["E501", "D103"]
"tests/*" = ["D"]
"epy_studio.spec" = ["D", "F821", "E501"]
"build.py" = ["D103"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config --cov --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*", "*/_archive/*", "*/epy_suite_connect/_packaging/*"]